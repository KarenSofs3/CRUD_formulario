<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro (Bootstrap)</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4" style="background: linear-gradient(135deg, #8e2de2 0%, #d86aff 100%); min-height: 100vh;">

<div class="container py-5">

    <!-- Card Form -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header text-white text-center py-3" style="background: #6a0dad;">
                    <h3 class="mb-0">💜 Registro de Usuario</h3>
                </div>
                <div class="card-body p-4 bg-white">

                    <div class="form-floating mb-3">
                        <input type="text" id="nombre" class="form-control rounded-3" placeholder="Nombre">
                        <label for="nombre">Nombre</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" id="apellido" class="form-control rounded-3" placeholder="Apellido">
                        <label for="apellido">Apellido</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" id="telefono" class="form-control rounded-3" placeholder="Teléfono">
                        <label for="telefono">Teléfono</label>
                    </div>

                    <button id="btnGuardar" class="btn w-100 py-2 rounded-3" style="background:#7b1fa2; color:white; font-size: 18px;">💾 Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header text-white text-center py-3 rounded-top-4" style="background:#7b1fa2;">
                    <h4 class="mb-0">📋 Usuarios Registrados</h4>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead style="background:#e1bee7;" class="text-center">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Teléfono</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>
                        <tbody id="datos" class="bg-white"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    let inpNombre = document.getElementById("nombre");
    let inpApellido = document.getElementById("apellido");
    let inpTelefono = document.getElementById("telefono");
    let registro = [];
    let editIndex = null;

    document.getElementById("btnGuardar").addEventListener("click", ()=>{

        if(inpNombre.value === ""){ alert("Se requiere el nombre"); return; }
        if(inpApellido.value === ""){ alert("Se requiere el apellido"); return; }
        if(inpTelefono.value === ""){ alert("Se requiere el teléfono"); return; }

        if (editIndex !== null) {
            registro[editIndex].nombre = inpNombre.value;
            registro[editIndex].apellido = inpApellido.value;
            registro[editIndex].telefono = inpTelefono.value;
            editIndex = null;
        } else {
            let data = {
                id: Date.now(),
                nombre: inpNombre.value,
                apellido: inpApellido.value,
                telefono: inpTelefono.value
            };
            registro.push(data);
        }

        pintar();
        limpiar();
    });

    function limpiar(){
        inpNombre.value = "";
        inpApellido.value = "";
        inpTelefono.value = "";
    }

    function pintar(){
        let tbody = document.getElementById("datos");
        tbody.innerHTML = "";

        registro.forEach((item, indice) =>{
            let tr = document.createElement("tr");
            tr.classList.add("text-center");

            tr.innerHTML = `
                <td>${item.id}</td>
                <td>${item.nombre}</td>
                <td>${item.apellido}</td>
                <td>${item.telefono}</td>
                <td class="text-center"></td>
            `;

            let btnEditar = document.createElement("button");
            btnEditar.textContent = "✏️ Editar";
            btnEditar.classList.add("btn", "btn-sm", "me-2");
            btnEditar.style.background = "#ab47bc";
            btnEditar.style.color = "white";
            btnEditar.addEventListener("click", () => {
                inpNombre.value = item.nombre;
                inpApellido.value = item.apellido;
                inpTelefono.value = item.telefono;
                editIndex = indice;
            });

            let btnEliminar = document.createElement("button");
            btnEliminar.textContent = "🗑️ Eliminar";
            btnEliminar.classList.add("btn", "btn-sm");
            btnEliminar.style.background = "#8e24aa";
            btnEliminar.style.color = "white";
            btnEliminar.addEventListener("click", () => {
                registro.splice(indice, 1);
                pintar();
            });

            tr.children[4].appendChild(btnEditar);
            tr.children[4].appendChild(btnEliminar);

            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
